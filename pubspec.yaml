name: my_first_food
description: "Baby feeding assistant powered by Gemini AI and your recipe books."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0-327.4.beta

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Immutable data classes
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Local storage
  hive_flutter: ^1.1.0

  # Secure storage (API keys at runtime)
  flutter_secure_storage: ^9.2.4

  # HTTP
  dio: ^5.8.0+1

  # Gemini AI SDK
  google_generative_ai: ^0.4.7

  # .env loading
  flutter_dotenv: ^5.2.1

  # Functional error handling (Either<Failure, T>)
  dartz: ^0.10.1

  # File paths
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^3.0.0
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - .env
